name: desktop ChatSurface proof

on:
  pull_request:
    paths:
      - 'proof/desktop-chat-surface/**'
      - '.github/workflows/desktop-chat-surface-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --manifest-path proof/desktop-chat-surface/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path proof/desktop-chat-surface/Cargo.toml --all-targets -- -D warnings
      - name: Test canonical trust-surface projection
        run: cargo test --manifest-path proof/desktop-chat-surface/Cargo.toml --all-targets
